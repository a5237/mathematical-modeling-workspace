  - icm

# Machine-contract keys contributed by this profile's rules.md.
contract_keys:
  - paper_maximum_bytes
  - body_page_maximum

# Paper framework template, relative to resources/templates/.
paper_framework: contests/mcm-icm/paper-framework.tex
